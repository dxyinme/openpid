name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu GCC
            os: ubuntu-latest
            cxx: g++
          - name: Ubuntu Clang
            os: ubuntu-latest
            cxx: clang++
          - name: Windows MSVC
            os: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Configure
        shell: bash
        run: |
          args=(-S . -B build)
          if [[ "${{ runner.os }}" != "Windows" ]]; then
            args+=(-DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=${{ matrix.cxx }})
          fi
          cmake "${args[@]}"

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ctest --test-dir build -C Release --output-on-failure
          else
            ctest --test-dir build --output-on-failure
          fi

      - name: Example
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            ./build/Release/openpid_first_order.exe
          else
            ./build/openpid_first_order
          fi
